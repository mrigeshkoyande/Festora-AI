<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/></head><body class="bg-surface font-body-md text-on-surface min-h-screen flex items-center justify-center"><main class="w-full max-w-md mx-auto p-gutter"><div class="flex flex-col w-full">
<!-- We are inside a constrained app shell (max-w-md mx-auto), but the user requested a split-screen auth page. 
       Since the shell restricts us to max-w-md, we will adapt the split-screen concept into a highly polished, 
       stacked-yet-layered immersive card layout that embodies the split-screen editorial aesthetic within the constraints. -->
<div class="relative w-full overflow-hidden rounded-xl bg-surface-container-low shadow-xl">
<!-- Top Visual / Photo Banner (Right Panel concept adapted for mobile/constrained width) -->
<div class="relative w-full h-64 bg-cover bg-center" data-alt="A sophisticated luxury event planning scene featuring a softly lit gala table arrangement with crystal glassware, warm ambient lighting, elegant floral centerpieces, and a modern editorial dark aesthetic with coral and champagne gold accents." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDthLk7ZjtNTaAHe-oiFWwPQWGrxbJc-DTGz4LpspRP3EmOOe9SwUioWDTTPrnY3a10C4psFYDRetV7MQ_lJGiprjT6Dxnsw9wupRa1npJxSRJwVbMqys1i47yV3GYaQvic6uImh8DNoo7FEB259BqnGwdTxf5ir0xUF3ItRy-7k6nT8r84zNhRuuaD1E1Tk8sqCGCSGZ2hMtYIT54fcXXcbjqGGSkw7cHuzlopaqbHz0bbSz2I7w')">
<div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/40 to-transparent"></div>
<!-- Floating Testimonial Card -->
<div class="absolute bottom-4 left-4 right-4 p-4 rounded-xl bg-surface/90 backdrop-blur-md shadow-lg">
<p class="font-headline-sm text-on-surface mb-1">"Every celebration, beautifully organized."</p>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-md text-tertiary">Festora AI Concierge</span>
</div>
</div>
</div>
<!-- Form Section (Left Panel concept) -->
<div class="p-6 md:p-8 bg-surface flex flex-col gap-6">
<!-- Header / Toggle State -->
<div class="flex flex-col gap-1">
<div class="flex items-center justify-between">
<span class="font-label-sm uppercase tracking-widest text-primary">Festora AI</span>
<div class="flex bg-surface-container rounded-full p-1 text-label-md">
<button class="px-4 py-1.5 rounded-full transition-all bg-primary text-on-primary font-semibold" id="tab-signin" onclick="setAuthMode('signin')" type="button">Sign In</button>
<button class="px-4 py-1.5 rounded-full transition-all text-on-surface hover:text-primary" id="tab-signup" onclick="setAuthMode('signup')" type="button">Sign Up</button>
</div>
</div>
<h1 class="font-headline-lg text-on-surface mt-2" id="auth-title">Welcome back</h1>
<p class="font-body-md text-tertiary" id="auth-subtitle">Enter your credentials to access your celebrations.</p>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-surface-container hover:bg-surface-container-high transition-all text-on-surface font-label-md" type="button">
<span class="material-symbols-outlined text-lg">public</span>
          Google
        </button>
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-surface-container hover:bg-surface-container-high transition-all text-on-surface font-label-md" type="button">
<span class="material-symbols-outlined text-lg">phone_iphone</span>
          Apple
        </button>
</div>
<div class="flex items-center gap-4 my-1">
<div class="h-[1px] bg-outline-variant flex-1 opacity-20"></div>
<span class="font-label-sm text-tertiary uppercase">or continue with email</span>
<div class="h-[1px] bg-outline-variant flex-1 opacity-20"></div>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<div class="hidden flex-col gap-1.5" id="name-field-container">
<label class="font-label-md text-on-surface">Full Name</label>
<input class="w-full bg-surface-container text-on-surface px-4 py-3 rounded-full focus:outline-none focus:ring-2 focus:ring-primary transition-all placeholder:text-tertiary/50 font-body-md" placeholder="Victoria Sterling" type="text"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-on-surface">Email address</label>
<input class="w-full bg-surface-container text-on-surface px-4 py-3 rounded-full focus:outline-none focus:ring-2 focus:ring-primary transition-all placeholder:text-tertiary/50 font-body-md" placeholder="victoria@example.com" type="email"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-on-surface">Password</label>
<input class="w-full bg-surface-container text-on-surface px-4 py-3 rounded-full focus:outline-none focus:ring-2 focus:ring-primary transition-all placeholder:text-tertiary/50 font-body-md" placeholder="••••••••••••" type="password"/>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 mt-1">
<input class="mt-1 w-4 h-4 accent-primary rounded cursor-pointer" id="terms" type="checkbox"/>
<label class="font-body-md text-tertiary text-xs leading-relaxed" for="terms">
            I agree to Festora AI's <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
          </label>
</div>
<!-- Coral Pill Continue Button -->
<button class="w-full mt-2 py-3.5 px-6 rounded-full bg-primary-container text-on-primary-container font-headline-sm hover:opacity-95 transition-all shadow-lg flex items-center justify-center gap-2" type="submit">
<span id="submit-btn-text">Continue</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Toggle Link Footer -->
<div class="text-center mt-2">
<p class="font-body-md text-tertiary text-sm">
<span id="toggle-prompt">Don't have an account?</span>
<button class="text-primary font-semibold hover:underline ml-1" id="toggle-action-btn" onclick="toggleAuthMode()" type="button">Sign up</button>
</p>
</div>
</div>
</div>
<script>
    let isSignUp = false;

    function setAuthMode(mode) {
      isSignUp = (mode === 'signup');
      const title = document.getElementById('auth-title');
      const subtitle = document.getElementById('auth-subtitle');
      const nameContainer = document.getElementById('name-field-container');
      const submitText = document.getElementById('submit-btn-text');
      const tabSignIn = document.getElementById('tab-signin');
      const tabSignUp = document.getElementById('tab-signup');
      const togglePrompt = document.getElementById('toggle-prompt');
      const toggleActionBtn = document.getElementById('toggle-action-btn');

      if (isSignUp) {
        title.innerText = "Create your account";
        subtitle.innerText = "Start planning extraordinary celebrations with AI.";
        nameContainer.classList.remove('hidden');
        nameContainer.classList.add('flex');
        submitText.innerText = "Get Started";
        tabSignUp.className = "px-4 py-1.5 rounded-full transition-all bg-primary text-on-primary font-semibold";
        tabSignIn.className = "px-4 py-1.5 rounded-full transition-all text-on-surface hover:text-primary";
        togglePrompt.innerText = "Already have an account?";
        toggleActionBtn.innerText = "Sign in";
      } else {
        title.innerText = "Welcome back";
        subtitle.innerText = "Enter your credentials to access your celebrations.";
        nameContainer.classList.add('hidden');
        nameContainer.classList.remove('flex');
        submitText.innerText = "Continue";
        tabSignIn.className = "px-4 py-1.5 rounded-full transition-all bg-primary text-on-primary font-semibold";
        tabSignUp.className = "px-4 py-1.5 rounded-full transition-all text-on-surface hover:text-primary";
        togglePrompt.innerText = "Don't have an account?";
        toggleActionBtn.innerText = "Sign up";
      }
    }

    function toggleAuthMode() {
      setAuthMode(isSignUp ? 'signin' : 'signup');
    }
  </script>
</div></main></body></html>
