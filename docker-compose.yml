version: "3.8"

services:
  festora-ai:
    container_name: festora-ai-app
    build:
      context: .
      dockerfile: Dockerfile
    image: festora-ai:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/ai/generate-plan"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    resources:
      limits:
        cpus: "2.0"
        memory: 2048M
      reservations:
        cpus: "0.5"
        memory: 512M
